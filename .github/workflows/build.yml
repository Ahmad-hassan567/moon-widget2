name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project
        run: |
          if [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            unzip -q -o ./*.zip -d src_unzipped
            f=$(find src_unzipped -name settings.gradle | head -n 1)
            echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: gradle test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: moon-widget-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
